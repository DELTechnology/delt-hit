# NF2 enrichment benchmark — 8 experiments for CAIX, CREBBP, wt-PI3K, H1047R-PI3K
# All counts_path entries are relative to this file's directory.
# Run from this directory: pixi run python ../benchmark_zscore.py
experiments:
- name: ss_caix
  save_dir: outputs
  selections:
  # NF2_NatChem_fl1_1 is a failed imported CAIX ss selection
  # (488 total reads versus 335k-564k reads for the valid CAIX ss selections)
  # and is excluded from the benchmark analysis.
  - name: NF2_NatChem_fl1_2
    group: protein
    counts_path: selections/NF2_NatChem_fl1_2/counts.txt
